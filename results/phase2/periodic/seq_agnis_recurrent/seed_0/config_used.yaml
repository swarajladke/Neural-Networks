  max_chars: 160
  repetition_ngram_n: 3
  stop_on_double_newline: true
  temperature: 0.0
  top_k: 0
hierarchy:
  commit_strides:
  - 1
  - 4
  - 16
  enabled: false
  k_sparse_per_layer:
  - 8
  - 4
  - 2
  lambda_td: 0.3
  layer_dims:
  - 64
  - 32
  - 16
  learning_rate_decay: 0.1
  max_units_per_layer:
  - 128
  - 48
  - 24
  n_settle: 10
memory:
  capacity: 10
  importance_decay: 0.999
  min_similarity_to_skip_write: 0.95
  replay_buffer_size: 5
  write_error_threshold: 0.05
  write_novelty_threshold: 0.05
model:
  d_in: 8
  d_z: 8
  eta_D: 0.01
  eta_E: 0.01
  eta_R: 0.005
  eta_z: 0.05
  fatigue_decay: 0.9
  gamma_fatigue: 0.5
  gate_alpha_max: 0.8
  gate_alpha_min: 0.2
  gate_beta: 1.0
  gate_ema: 0.05
