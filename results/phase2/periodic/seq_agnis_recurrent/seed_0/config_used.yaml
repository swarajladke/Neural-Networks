  beta: 0.5
  consecutive_n: 10
  delta: 0.4
  enabled: false
  gamma: 0.3
  importance_threshold: 0.01
  kappa: 0.3
  lambda_cost: 0.2
  maturity_floor: 0.05
  max_units: 64
  prune_interval: 100
  redundancy_threshold: 0.9
  threshold: 0.6
  usage_threshold: 0.05
